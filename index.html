<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2f6b45" />
    <link rel="icon" href="data:," />
    <title>Сплав</title>
    <!-- YG-01: the Yandex SDK, before the game code. -->
    <script src="/sdk.js"></script>
    <!-- UI-01: guesses the loading-screen language before the game code loads. -->
    <script src="./boot.js"></script>
    <style>
      /* INP-06: no selection, context menu, scrolling or pull-to-refresh. */
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      body {
        position: fixed;
        inset: 0;
        background: #2f6b45;
        color: #ffffff;
        font-family:
          'Nunito',
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          Arial,
          sans-serif;
      }
      img,
      svg,
      canvas {
        -webkit-user-drag: none;
      }

      /* UI-01: loading screen, visible before any script runs. */
      #loading {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 28%, rgba(255, 246, 200, 0.75) 0%, transparent 45%),
          linear-gradient(#9fdcf5 0%, #6cc6ee 42%, #8fd16a 42.5%, #5fa848 100%);
        transition: opacity 0.25s ease-out;
      }
      /* A river across the meadow. */
      #loading::before {
        content: '';
        position: absolute;
        left: -60%;
        right: -60%;
        top: 60%;
        height: 15%;
        border-radius: 50%;
        background: linear-gradient(#6fd0f2, #2f9bd4);
        box-shadow:
          0 -6px 0 #f2dba6,
          0 6px 0 #f2dba6;
        transform: rotate(-4deg);
      }
      #loading.done {
        opacity: 0;
        pointer-events: none;
      }
      .loading-title {
        position: relative;
        font-size: 54px;
        font-weight: 900;
        letter-spacing: 0.01em;
        color: #ffffff;
        text-shadow:
          0 4px 0 #4a2f1b,
          0 -2px 0 #4a2f1b,
          3px 0 0 #4a2f1b,
          -3px 0 0 #4a2f1b,
          3px 3px 0 #4a2f1b,
          -3px 3px 0 #4a2f1b,
          0 10px 18px rgba(0, 0, 0, 0.25);
      }
      html[data-boot-lang='en'] .t-ru,
      html:not([data-boot-lang='en']) .t-en {
        display: none;
      }
      .loading-track {
        position: relative;
        width: min(240px, 70vw);
        height: 18px;
        border-radius: 9px;
        background: rgba(74, 47, 27, 0.35);
        border: 3px solid #4a2f1b;
        box-shadow: 0 3px 0 #4a2f1b;
        overflow: hidden;
      }
      #loading-bar {
        width: 15%;
        height: 100%;
        border-radius: 6px;
        background: linear-gradient(#ffe17a, #ffbf2e);
        box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.6);
        transition: width 0.3s ease-out;
      }
    </style>
  </head>
  <body>
    <div id="viewport">
      <div id="stage">
        <div id="canvas-host"></div>
        <div id="ui"></div>
      </div>
    </div>
    <div id="loading">
      <div class="loading-title">
        <span class="t-ru">Сплав</span><span class="t-en">Merge River</span>
      </div>
      <div class="loading-track"><div id="loading-bar"></div></div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
