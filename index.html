<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2f6b45" />
    <link rel="icon" href="data:," />
    <title>Сплав</title>
    <!-- YG-01: the Yandex SDK, before the game code. -->
    <script src="/sdk.js"></script>
    <!-- UI-01: guesses the loading-screen language before the game code loads. -->
    <script src="./boot.js"></script>
    <style>
      /* INP-06: no selection, context menu, scrolling or pull-to-refresh. */
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        position: fixed;
        inset: 0;
        background: #2f6b45;
        color: #ffffff;
        font-family:
          'Nunito',
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          Arial,
          sans-serif;
      }
      img,
      svg,
      canvas {
        -webkit-user-drag: none;
      }

      /* UI-01: loading screen, visible before any script runs. */
      #loading {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: radial-gradient(circle at 50% 40%, #6fc3e8 0%, #3b8fc0 55%, #2f6b45 100%);
        transition: opacity 0.25s ease-out;
      }
      #loading.done {
        opacity: 0;
        pointer-events: none;
      }
      .loading-title {
        font-size: 48px;
        font-weight: 800;
        letter-spacing: 0.02em;
        color: #ffffff;
        text-shadow: 0 3px 0 #1f5a7a;
      }
      html[data-boot-lang='en'] .t-ru,
      html:not([data-boot-lang='en']) .t-en {
        display: none;
      }
      .loading-track {
        width: min(240px, 70vw);
        height: 14px;
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.3);
        border: 2px solid #1f5a7a;
        overflow: hidden;
      }
      #loading-bar {
        width: 15%;
        height: 100%;
        border-radius: 5px;
        background: #ffd75e;
        transition: width 0.3s ease-out;
      }
    </style>
  </head>
  <body>
    <div id="viewport">
      <div id="stage">
        <div id="canvas-host"></div>
        <div id="ui"></div>
      </div>
    </div>
    <div id="loading">
      <div class="loading-title">
        <span class="t-ru">Сплав</span><span class="t-en">Merge River</span>
      </div>
      <div class="loading-track"><div id="loading-bar"></div></div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
